[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "read-write", path = "./deployments" }
]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts-upgradeable/=lib/v2-matching/lib/openzeppelin-contracts-upgradeable/contracts/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "openzeppelin/=lib/openzeppelin-contracts/contracts/",
  "@layerzerolabs/lz-evm-oapp-v2/=lib/lz-address-book/lib/LayerZero-v2/packages/layerzero-v2/evm/oapp/",
  "@layerzerolabs/lz-evm-protocol-v2/=lib/lz-address-book/lib/LayerZero-v2/packages/layerzero-v2/evm/protocol/",
  "@layerzerolabs/oapp-evm-upgradeable/=lib/lz-address-book/lib/devtools/packages/oapp-evm-upgradeable/",
  "@layerzerolabs/oapp-evm/=lib/lz-address-book/lib/devtools/packages/oapp-evm/",
  "permit2/=lib/euler-earn/lib/euler-vault-kit/lib/permit2/",
  "lyra-utils/=lib/v2-matching/lib/v2-core/lib/lyra-utils/src/"
]

[profile.ci]
# Keep deterministic headroom under EIP-170 on hosted runners where
# metadata/path variance can otherwise push CollarVault a few bytes over limit.
bytecode_hash = "none"

# Formatting
[fmt]
ignore = ["lib/**"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
