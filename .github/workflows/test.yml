name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry (attempt 1)
        id: foundry_install_check_1
        continue-on-error: true
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Foundry (attempt 2)
        if: steps.foundry_install_check_1.outcome == 'failure'
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build

      - name: Run Forge tests
        run: forge test -vvv
